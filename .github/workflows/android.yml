name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Testes, lint e APK de debug
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Mostrar avisos do lint
        if: always()
        run: cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true

      - name: Publicar APK
        uses: actions/upload-artifact@v6
        with:
          name: vinil-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publicar relatório do lint
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
